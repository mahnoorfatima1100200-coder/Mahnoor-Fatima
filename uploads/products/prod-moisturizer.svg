<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceee9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fffdfa" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2c2425" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#grad)"/>
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.75" filter="url(#shadow)"/>
  <g transform="translate(140, 100)">
    <!-- Skincare Bottle / Jar Silhouette -->
    <rect x="35" y="10" width="50" height="25" rx="4" fill="#c59b97" opacity="0.9"/>
    <rect x="45" y="0" width="30" height="12" rx="3" fill="#c59b97"/>
    <path d="M 20 40 C 20 35, 100 35, 100 40 L 105 140 C 105 150, 95 155, 60 155 C 25 155, 15 150, 15 140 Z" fill="#ffffff" stroke="#c59b97" stroke-width="2.5" filter="url(#shadow)"/>
    <rect x="25" y="65" width="70" height="55" rx="3" fill="#fffdfa" stroke="#ede4e0" stroke-width="1"/>
    <text x="60" y="82" font-family="'Playfair Display', serif" font-size="9" font-weight="bold" fill="#2c2425" text-anchor="middle">SKINORA</text>
    <text x="60" y="96" font-family="'Poppins', sans-serif" font-size="7" fill="#c59b97" text-anchor="middle">CREAM</text>
    <text x="60" y="108" font-family="'Poppins', sans-serif" font-size="6" fill="#726264" text-anchor="middle">30ml / 1.0 fl oz</text>
  </g>
  <text x="200" y="325" font-family="'Playfair Display', serif" font-size="18" font-weight="bold" fill="#2c2425" text-anchor="middle">Barrier Relief</text>
  <text x="200" y="348" font-family="'Poppins', sans-serif" font-size="12" fill="#726264" text-anchor="middle">Ceramide Daily Cream</text>
  <text x="200" y="370" font-family="'Poppins', sans-serif" font-size="10" letter-spacing="1.5" fill="#c59b97" text-anchor="middle">DERMATOLOGIST TESTED</text>
</svg>
